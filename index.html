<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#222">
<title>Учёт материалов — WORK v2 · SCANNER v8</title>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f4f4;color:#222}
.app{max-width:520px;margin:auto}
h1{text-align:center;font-size:25px;margin:10px 0 5px}
.subtitle{text-align:center;color:#777;margin-bottom:12px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
label{display:block;font-weight:600;margin-bottom:7px}
select{width:100%;padding:15px;border:1px solid #ccc;border-radius:10px;font-size:18px;background:#fff}
button{width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:600;margin-top:10px}
.primary{background:#222;color:#fff}.blue{background:#1677ff;color:#fff}.gray{background:#e5e5e5;color:#222}.danger{background:#eee;color:#a00000}
.machine-title{font-size:23px;font-weight:700;margin-bottom:8px}
.operator-info{color:#777;font-size:14px}
.connection{padding:12px 14px;border-radius:10px;font-size:14px;font-weight:700;margin-top:14px}
.online{background:#e9f7e9;color:#176b17}.offline{background:#fff3d9;color:#8a5a00}
.state-loading,.state-ok,.state-error{margin-top:10px;padding:12px;border-radius:10px;font-weight:600}
.state-loading{background:#eef3f8;color:#333}.state-ok{background:#e9f7e9;color:#176b17}.state-error{background:#fdecec;color:#a00000}
.pending{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff3d9;color:#8a5a00;font-size:14px;font-weight:600}
.material-block{border:1px solid #ddd;border-radius:12px;padding:15px;margin-bottom:12px}
.material-name{font-size:17px;font-weight:700}.status{margin-top:6px;font-size:14px;font-weight:700}
.status-installed{color:#16821c}.status-empty{color:#777}
.material-value{margin-top:8px;word-break:break-all;color:#555;font-size:14px}
.shop-row{display:flex;align-items:center;gap:8px;margin-top:9px}
.shop-code{flex:1;padding:11px;background:#f4f4f4;border-radius:9px;word-break:break-all;font-size:14px}
.shop-row button{width:auto;margin:0;padding:10px 12px;font-size:14px}
#scannerCard,#confirmBlock,#status{display:none}
#scanner{position:relative;overflow:hidden;border-radius:14px;background:#000;margin-top:12px}
#video{width:100%;display:block}
.frame{position:absolute;left:8%;right:8%;top:23%;height:54%;border:3px solid #fff;border-radius:10px;pointer-events:none}
.hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px #000}
#stopScan,#canvas{display:none}
.success,.error,.info{padding:13px;border-radius:10px}
.success{background:#e9f7e9;color:#176b17}.error{background:#fdecec;color:#a00000}.info{background:#eef3f8;color:#333}
.small{color:#777;font-size:14px}
.parsed-box{margin-top:12px;padding:12px;border-radius:10px;background:#f4f4f4}
.parsed-row{margin-top:5px}.parsed-label{color:#777}.parsed-value{font-weight:700;word-break:break-all}
</style>
</head>
<body>
<div class="app">
<h1>УЧЁТ МАТЕРИАЛОВ</h1>
<div class="subtitle">Z-стекеры</div>
<div style="text-align:center;font-size:12px;color:#777;margin:-4px 0 12px">WORK v2 · SCANNER v8</div>
<div id="connectionStatus" class="connection online">🟢 ОНЛАЙН</div>

<div id="startScreen" class="card">
<label>Оператор</label>
<select id="operator">
<option value="">Выберите оператора</option>
<option value="Иванов И.И.">Иванов И.И.</option>
<option value="Петров П.П.">Петров П.П.</option>
<option value="Сидоров С.С.">Сидоров С.С.</option>
</select>
<label style="margin-top:18px">Z-стекер</label>
<select id="machine">
<option value="">Выберите Z-стекер</option>
<option value="ZST-001" data-name="Z-01">Z-01</option>
<option value="ZST-002" data-name="Z-02">Z-02</option>
<option value="ZST-003" data-name="Z-03">Z-03</option>
<option value="ZST-004" data-name="Z-04">Z-04</option>
<option value="ZST-005" data-name="Z-05">Z-05</option>
<option value="ZST-006" data-name="Z-06">Z-06</option>
</select>
<button class="primary" onclick="openMachine()">ОТКРЫТЬ Z-СТЕКЕР</button>
<div id="startStatus" class="small" style="margin-top:12px">Выберите оператора и машину</div>
</div>

<div id="workScreen" style="display:none">
<div class="card">
<div id="machineTitle" class="machine-title">Z-СТЕКЕР</div>
<div id="operatorInfo" class="operator-info"></div>
<div id="stateStatus" class="state-loading">🔄 Загрузка состояния машины...</div>
<div id="pendingInfo" class="pending" style="display:none"></div>
</div>

<div class="card">
<div class="material-block">
<div class="material-name">КЛЕЙ</div>
<div id="glueStatus" class="status status-empty">⚪ НЕ УСТАНОВЛЕН</div>
<div id="glueValue" class="material-value">—</div>
<button class="blue" onclick="startGlueScan()">ЗАМЕНИТЬ КЛЕЙ</button>
</div>

<div class="material-block">
<div class="material-name">СЕПАРАТОР</div>
<div id="separatorStatus" class="status status-empty">⚪ НЕ УСТАНОВЛЕН</div>
<div id="separatorValue" class="material-value">—</div>
<button class="blue" onclick="startSeparatorScan()">ЗАМЕНИТЬ СЕПАРАТОР</button>
</div>

<div class="material-block">
<div class="material-name">МАГАЗИНЫ ЭЛЕКТРОДОВ</div>
<div id="shopsStatus" class="status status-empty">⚪ НЕ УСТАНОВЛЕНЫ</div>
<div id="shopsContainer"></div>
<button id="addShopButton" class="blue" onclick="startShopScan()">＋ ДОБАВИТЬ МАГАЗИН</button>
</div>
<button class="gray" onclick="changeMachine()">ВЫБРАТЬ ДРУГУЮ МАШИНУ</button>
</div>
</div>
</div>

<div id="scannerCard" class="card">
<div id="scanTitle" class="machine-title">СКАНИРОВАНИЕ КОДА</div>
<div id="scanner">
<video id="video" autoplay muted playsinline></video>
<div class="frame"></div>
<div class="hint">Наведите QR или штрихкод в рамку</div>
</div>
<button id="stopScan" class="gray" onclick="stopScanner()">ОСТАНОВИТЬ КАМЕРУ</button>
<canvas id="canvas"></canvas>
</div>

<div id="confirmBlock" class="card">
<div class="machine-title">ПРОВЕРЬТЕ ДАННЫЕ</div>
<div id="confirmData" class="material-value"></div>
<button class="blue" onclick="confirmOperation()">ПОДТВЕРДИТЬ И СОХРАНИТЬ</button>
<button class="gray" onclick="cancelOperation()">ОТМЕНА</button>
</div>
<div id="status"></div>
</div>

<script>
const BACKEND_URL="https://script.google.com/macros/s/AKfycbxoJXLeVPG3Yiqx6tTovtkONlXNfPwXgqJyrAcCDf_gSksrzTHSifwKZkIJkH7_s99O-g/exec";
const QUEUE_KEY="zstacker_pending_operations_v2";
const STATE_PREFIX="zstacker_state_v2_";

let stream=null,scanning=false,timer=null,zxingReader=null,zxingControls=null;
let currentOperator="",currentMachineId="",currentMachineName="";
let currentOperation="",scannedRaw="",scannedLot="",scannedMeters="";
let currentState=null;

function showStatus(message,type){const el=document.getElementById("status");el.style.display="block";el.className=type||"info";el.textContent=message}
function hideStatus(){document.getElementById("status").style.display="none"}
function setConnection(online,text){
  const el=document.getElementById("connectionStatus");
  el.className="connection "+(online?"online":"offline");
  el.textContent=online?"🟢 ОНЛАЙН":"🟠 "+(text||"НЕТ СВЯЗИ");
  updatePendingInfo();
}
function updatePendingInfo(){
  const el=document.getElementById("pendingInfo"),n=getQueue().length;
  if(n){el.style.display="block";el.textContent="🟠 Операций ожидают отправки: "+n}
  else el.style.display="none";
}
function getQueue(){try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]")}catch(e){return[]}}
function setQueue(q){localStorage.setItem(QUEUE_KEY,JSON.stringify(q));updatePendingInfo()}
function makeOperationId(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10)}
function getCachedState(id){try{return JSON.parse(localStorage.getItem(STATE_PREFIX+id)||"null")}catch(e){return null}}
function setCachedState(s){if(s&&s.machineId)localStorage.setItem(STATE_PREFIX+s.machineId,JSON.stringify(s))}

function parseScannedData(raw){
  const original=String(raw||"").trim();
  let value=original;
  let meters="";

  // Клей: QR имеет вид "2938081 / 891531 / 190626 / 2606190180".
  // Для учёта используем только первое поле — Lot ID.
  if(currentOperation==="Замена клея"){
    const parts=original.split("/").map(x=>x.trim()).filter(Boolean);
    value=parts[0]||"";
    return {lotId:value,meters:"",raw:original};
  }

  // Сепаратор: метраж вида "2000m" отделяем в отдельное поле.
  if(currentOperation==="Замена сепаратора"){
    const m=value.match(/(\d+(?:[.,]\d+)?)\s*m$/i);
    if(m){
      meters=m[1].replace(",",".");
      value=value.slice(0,m.index).trim();
    }
    return {lotId:value,meters:meters,raw:original};
  }

  // Магазин: весь Code 128 = Lot ID.
  return {lotId:value,meters:"",raw:original};
}

function applyLocalOperation(state,op){
  const s=Object.assign({},state||{machineId:currentMachineId,machine:currentMachineName,glue:"",separator:"",shop1:"",shop2:""});
  if(op.operation==="Замена клея")s.glue=op.lotId;
  if(op.operation==="Замена сепаратора")s.separator=op.lotId;
  if(op.operation==="Установка магазина"){
    if(!s.shop1)s.shop1=op.lotId; else if(!s.shop2)s.shop2=op.lotId;
  }
  if(op.operation==="Снятие магазина"){
    if(String(s.shop1)===String(op.lotId))s.shop1="";
    else if(String(s.shop2)===String(op.lotId))s.shop2="";
  }
  s.updated=new Date().toISOString();s.operator=op.operator;return s;
}

function openMachine(){
  const operator=document.getElementById("operator").value,m=document.getElementById("machine"),id=m.value;
  if(!operator){document.getElementById("startStatus").textContent="Сначала выберите оператора.";return}
  if(!id){document.getElementById("startStatus").textContent="Выберите Z-стекер.";return}
  currentOperator=operator;currentMachineId=id;currentMachineName=m.options[m.selectedIndex].dataset.name;
  document.getElementById("startScreen").style.display="none";document.getElementById("workScreen").style.display="block";
  document.getElementById("machineTitle").textContent="Z-СТЕКЕР "+currentMachineName;
  document.getElementById("operatorInfo").textContent="Оператор: "+currentOperator;
  loadState();syncQueue();
}

async function loadState(){
  const st=document.getElementById("stateStatus");st.className="state-loading";st.textContent="🔄 Загрузка состояния машины...";
  const cached=getCachedState(currentMachineId);
  if(!navigator.onLine){
    if(cached){currentState=cached;renderState(cached);st.className="state-error";st.textContent="🟠 НЕТ СВЯЗИ — показано последнее сохранённое состояние"}
    else{st.className="state-error";st.textContent="🔴 Не удалось загрузить состояние машины. Нет связи с интернетом."}
    setConnection(false);return
  }
  try{
    const r=await fetch(BACKEND_URL+"?action=getState&machineId="+encodeURIComponent(currentMachineId),{cache:"no-store"});
    const text=await r.text();if(text.startsWith("ERROR|"))throw new Error(text.substring(6));
    const data=JSON.parse(text);currentState=data;setCachedState(data);renderState(data);
    st.className="state-ok";st.textContent="🟢 Состояние машины загружено";setConnection(true);
  }catch(e){
    setConnection(false,"НЕТ СВЯЗИ");
    if(cached){currentState=cached;renderState(cached);st.className="state-error";st.textContent="🔴 Не удалось загрузить состояние с сервера. Показано последнее сохранённое состояние."}
    else{st.className="state-error";st.textContent="🔴 Не удалось загрузить состояние машины. Проверьте интернет."}
  }
}
function renderState(d){updateGlue(d.glue||"");updateSeparator(d.separator||"");updateShops(d.shop1||"",d.shop2||"")}
function updateGlue(code){const s=document.getElementById("glueStatus"),v=document.getElementById("glueValue");if(code){s.textContent="🟢 УСТАНОВЛЕН";s.className="status status-installed";v.textContent=code}else{s.textContent="⚪ НЕ УСТАНОВЛЕН";s.className="status status-empty";v.textContent="—"}}
function updateSeparator(code){const s=document.getElementById("separatorStatus"),v=document.getElementById("separatorValue");if(code){s.textContent="🟢 УСТАНОВЛЕН";s.className="status status-installed";v.textContent=code}else{s.textContent="⚪ НЕ УСТАНОВЛЕН";s.className="status status-empty";v.textContent="—"}}
function updateShops(a,b){
  const c=document.getElementById("shopsContainer"),s=document.getElementById("shopsStatus"),btn=document.getElementById("addShopButton");c.innerHTML="";
  const shops=[a,b].filter(Boolean);
  if(!shops.length){s.textContent="⚪ НЕ УСТАНОВЛЕНЫ";s.className="status status-empty"}
  else{s.textContent="🟢 УСТАНОВЛЕНЫ: "+shops.length;s.className="status status-installed";shops.forEach(shop=>{
    const row=document.createElement("div");row.className="shop-row";const code=document.createElement("div");code.className="shop-code";code.textContent=shop;
    const b=document.createElement("button");b.className="danger";b.textContent="СНЯТЬ";b.onclick=()=>removeShop(shop);row.appendChild(code);row.appendChild(b);c.appendChild(row)
  })}
  btn.style.display=shops.length>=2?"none":"block"
}

function startGlueScan(){startScan("Замена клея","СКАНИРУЙТЕ КЛЕЙ")}
function startSeparatorScan(){startScan("Замена сепаратора","СКАНИРУЙТЕ СЕПАРАТОР")}
function startShopScan(){
  const n=[currentState?.shop1,currentState?.shop2].filter(Boolean).length;
  if(n>=2){showStatus("На машине уже установлены 2 магазина.","error");return}
  startScan("Установка магазина","СКАНИРУЙТЕ МАГАЗИН")
}
function startScan(op,title){
  currentOperation=op;scannedRaw="";scannedLot="";scannedMeters="";
  document.getElementById("scannerCard").style.display="block";document.getElementById("scanTitle").textContent=title;
  document.getElementById("confirmBlock").style.display="none";startScanner()
}

async function startScanner(){
  stopScanner();
  try{
    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("Браузер не поддерживает камеру");
    }
    if(!window.ZXingBrowser?.BrowserMultiFormatReader){
      throw new Error("Сканер ZXing не загрузился");
    }

    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1280},
        height:{ideal:720}
      }
    });

    const video=document.getElementById("video");
    video.srcObject=stream;
    video.setAttribute("playsinline","");
    video.muted=true;
    await video.play();

    document.getElementById("scanner").style.display="block";
    document.getElementById("stopScan").style.display="block";
    scanning=true;
    cameraFrameNo=0;
    cameraDecodeBusy=false;

    showStatus("Универсальный сканер: QR и 1D штрихкод. Ищу код...","info");

    zxingReader=new ZXingBrowser.BrowserMultiFormatReader();

    cameraDecodeLoop();

  }catch(e){
    stopScanner();
    showStatus(
      "Не удалось открыть сканер: "+(e.name||e.message||"неизвестная ошибка"),
      "error"
    );
  }
}

let cameraDecodeBusy=false;
let cameraDecodeTimer=null;
let cameraFrameNo=0;
let scanStartedAt=0;

async function cameraDecodeLoop(){
  if(!scanning)return;

  const video=document.getElementById("video");

  if(cameraDecodeBusy || video.readyState<2 || !video.videoWidth){
    cameraDecodeTimer=setTimeout(cameraDecodeLoop,100);
    return;
  }

  cameraDecodeBusy=true;
  cameraFrameNo++;

  try{
    if(!scanStartedAt)scanStartedAt=performance.now();

    const vw=video.videoWidth;
    const vh=video.videoHeight;

    const sourceCanvas=document.getElementById("canvas");
    const ctx=sourceCanvas.getContext("2d",{willReadFrequently:true});

    const maxW=960;
    const scale=Math.min(1,maxW/vw);
    const w=Math.max(1,Math.round(vw*scale));
    const h=Math.max(1,Math.round(vh*scale));

    sourceCanvas.width=w;
    sourceCanvas.height=h;
    ctx.drawImage(video,0,0,w,h);

    // QR/Data Matrix — весь кадр, каждый второй кадр.
    if(cameraFrameNo%2===0){
      const whole=await decodeCameraCanvas(sourceCanvas);
      if(whole){
        handleScanResult(whole.text);
        return;
      }
    }

    // Code 128 и другие 1D — центральная горизонтальная полоса.
    const strip=document.createElement("canvas");
    strip.width=w;
    strip.height=Math.max(100,Math.round(h*0.22));

    const sy=Math.round((h-strip.height)/2);
    const sctx=strip.getContext("2d",{willReadFrequently:true});

    sctx.drawImage(
      sourceCanvas,
      0,sy,w,strip.height,
      0,0,w,strip.height
    );

    const oneD=await decodeCameraCanvas(strip);
    if(oneD){
      handleScanResult(oneD.text);
      return;
    }

    // Инверсия — только периодически для белого Code 128 на чёрном фоне.
    if(cameraFrameNo%8===0){
      const image=sctx.getImageData(0,0,strip.width,strip.height);

      for(let i=0;i<image.data.length;i+=4){
        const y=Math.round(
          0.299*image.data[i]+
          0.587*image.data[i+1]+
          0.114*image.data[i+2]
        );
        image.data[i]=255-y;
        image.data[i+1]=255-y;
        image.data[i+2]=255-y;
      }

      sctx.putImageData(image,0,0);

      const inverted=await decodeCameraCanvas(strip);
      if(inverted){
        handleScanResult(inverted.text);
        return;
      }
    }

  }catch(e){
    // Отдельный неудачный кадр не является ошибкой — продолжаем сканирование.
  }finally{
    cameraDecodeBusy=false;
  }

  if(scanning){
    cameraDecodeTimer=setTimeout(cameraDecodeLoop,80);
  }
}

async function decodeCameraCanvas(canvas){
  try{
    if(!zxingReader){
      zxingReader=new ZXingBrowser.BrowserMultiFormatReader();
    }

    const result=await zxingReader.decodeFromImageUrl(
      canvas.toDataURL("image/jpeg",0.82)
    );

    if(result?.getText()){
      return {
        text:result.getText(),
        format:result.getBarcodeFormat
          ? result.getBarcodeFormat()
          : "UNKNOWN"
      };
    }
  }catch(e){}

  return null;
}


function handleScanResult(raw){
  if(!scanning)return;
  const p=parseScannedData(raw);
  if(!p.lotId){showStatus("Код считан, но Lot ID пустой.","error");return}
  scannedRaw=p.raw;scannedLot=p.lotId;scannedMeters=p.meters;
  stopScanner();showConfirmation()
}

function scanLoop(){
  if(!scanning)return;
  const video=document.getElementById("video"),canvas=document.getElementById("canvas");
  if(video.readyState>=2&&video.videoWidth){
    canvas.width=video.videoWidth;canvas.height=video.videoHeight;
    const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(video,0,0,canvas.width,canvas.height);
    const image=ctx.getImageData(0,0,canvas.width,canvas.height);
    const result=jsQR(image.data,image.width,image.height,{inversionAttempts:"attemptBoth"});
    if(result?.data){handleScanResult(result.data);return}
  }
  timer=setTimeout(scanLoop,100)
}

function stopScanner(){
  scanning=false;

  if(cameraDecodeTimer){
    clearTimeout(cameraDecodeTimer);
    cameraDecodeTimer=null;
  }

  cameraDecodeBusy=false;
  cameraFrameNo=0;
  scanStartedAt=0;

  try{zxingControls?.stop?.()}catch(e){}
  zxingControls=null;

  try{zxingReader?.reset?.()}catch(e){}
  zxingReader=null;

  if(stream){
    try{stream.getTracks().forEach(t=>t.stop())}catch(e){}
    stream=null;
  }

  const v=document.getElementById("video");
  if(v)v.srcObject=null;

  document.getElementById("scanner").style.display="none";
  document.getElementById("stopScan").style.display="none";
}

function showConfirmation(){
  document.getElementById("confirmBlock").style.display="block";
  let html="<b>Машина:</b> "+escapeHtml(currentMachineName)+"<br><br><b>Оператор:</b> "+escapeHtml(currentOperator)+"<br><br><b>Операция:</b> "+escapeHtml(currentOperation)+"<div class='parsed-box'><div class='parsed-row'><span class='parsed-label'>Lot ID:</span><br><span class='parsed-value'>"+escapeHtml(scannedLot)+"</span></div>";
  if(scannedMeters)html+="<div class='parsed-row'><span class='parsed-label'>Метраж:</span><br><span class='parsed-value'>"+escapeHtml(scannedMeters)+" м</span></div>";
  html+="</div>";
  document.getElementById("confirmData").innerHTML=html;showStatus("Код считан. Проверьте Lot ID и метраж.","info")
}
function getMaterialType(){if(currentOperation==="Замена клея")return"Клей";if(currentOperation==="Замена сепаратора")return"Сепаратор";if(currentOperation==="Установка магазина"||currentOperation==="Снятие магазина")return"Магазин электродов";return""}

async function saveOperation(op){
  const q=getQueue();q.push(op);setQueue(q);
  if(currentState){currentState=applyLocalOperation(currentState,op);setCachedState(currentState);renderState(currentState)}
  await syncQueue()
}
async function sendOperation(op){
  const u=BACKEND_URL+"?action=save"+
    "&operator="+encodeURIComponent(op.operator)+
    "&machineId="+encodeURIComponent(op.machineId)+
    "&machine="+encodeURIComponent(op.machine)+
    "&operation="+encodeURIComponent(op.operation)+
    "&materialType="+encodeURIComponent(op.materialType)+
    "&lotId="+encodeURIComponent(op.lotId)+
    "&meters="+encodeURIComponent(op.meters||"")+
    "&rawCode="+encodeURIComponent(op.rawCode||"")+
    "&operationId="+encodeURIComponent(op.operationId);
  const r=await fetch(u,{cache:"no-store"}),t=await r.text();
  if(!t.startsWith("OK|"))throw new Error(t.replace(/^ERROR\|/,"")||"Сервер не подтвердил запись");
  return t
}
async function syncQueue(){
  const q=getQueue();if(!q.length){updatePendingInfo();return}
  if(!navigator.onLine){setConnection(false);return}
  setConnection(true);
  const remaining=[];let sent=0;
  for(const op of q){
    try{await sendOperation(op);sent++}catch(e){remaining.push(op);break}
  }
  setQueue(remaining);
  if(sent){showStatus("✓ Синхронизировано операций: "+sent,"success");if(currentMachineId)await loadState()}
  updatePendingInfo()
}
async function confirmOperation(){
  if(!scannedLot){showStatus("Lot ID не найден.","error");return}
  const op={operationId:makeOperationId(),operator:currentOperator,machineId:currentMachineId,machine:currentMachineName,operation:currentOperation,materialType:getMaterialType(),lotId:scannedLot,meters:scannedMeters,rawCode:scannedRaw,createdAt:new Date().toISOString()};
  showStatus(navigator.onLine?"Сохраняем...":"🟠 Нет связи. Сохраняем операцию на телефоне...","info");
  try{
    await saveOperation(op);
    document.getElementById("confirmBlock").style.display="none";document.getElementById("scannerCard").style.display="none";
    scannedRaw="";scannedLot="";scannedMeters="";currentOperation="";
    if(getQueue().some(x=>x.operationId===op.operationId))showStatus("🟠 Операция сохранена на телефоне и ожидает отправки.","info");
    else showStatus("✓ Операция сохранена и синхронизирована.","success")
  }catch(e){showStatus("🔴 Не удалось сохранить операцию: "+e.message,"error")}
}
function removeShop(shopCode){
  if(!confirm("Снять магазин "+shopCode+"?"))return;
  const op={operationId:makeOperationId(),operator:currentOperator,machineId:currentMachineId,machine:currentMachineName,operation:"Снятие магазина",materialType:"Магазин электродов",lotId:shopCode,meters:"",rawCode:shopCode,createdAt:new Date().toISOString()};
  showStatus(navigator.onLine?"Снимаем магазин...":"🟠 Нет связи. Снятие сохранится на телефоне.","info");
  saveOperation(op).then(()=>{if(getQueue().some(x=>x.operationId===op.operationId))showStatus("🟠 Снятие магазина сохранено и ожидает отправки.","info");else showStatus("✓ Магазин снят и синхронизирован.","success")}).catch(e=>showStatus("🔴 Не удалось сохранить операцию: "+e.message,"error"))
}
function cancelOperation(){scannedRaw="";scannedLot="";scannedMeters="";currentOperation="";stopScanner();document.getElementById("scannerCard").style.display="none";document.getElementById("confirmBlock").style.display="none";showStatus("Операция отменена.","info")}
function changeMachine(){stopScanner();document.getElementById("workScreen").style.display="none";document.getElementById("scannerCard").style.display="none";document.getElementById("confirmBlock").style.display="none";document.getElementById("startScreen").style.display="block";hideStatus()}
function escapeHtml(text){return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
window.addEventListener("online",async()=>{setConnection(true);await syncQueue()});
window.addEventListener("offline",()=>setConnection(false,"НЕТ СВЯЗИ"));
setConnection(navigator.onLine);updatePendingInfo();
</script>
