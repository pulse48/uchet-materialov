<style>

* {
  box-sizing: border-box;
}

body {

  font-family:

}

.card {

  box-shadow:

}

label {
  display: block;
  font-weight: 600;
  margin-bottom: 7px;
}

select {
  width: 100%;
  padding: 15px;

  border: 1px solid #ccc;

  border-radius: 10px;

  font-size: 18px;

  background: #fff;
}

button {
  width: 100%;

  border: 0;

  border-radius: 12px;

  padding: 15px;

  font-size: 16px;

  font-weight: 600;

  margin-top: 10px;
}

.primary {
  background: #222;
  color: #fff;
}

.blue {
  background: #1677ff;
  color: #fff;
}

.gray {
  background: #e5e5e5;
  color: #222;
}

.danger {
  background: #eee;
  color: #a00000;
}

.machine-title {
  font-size: 23px;
  font-weight: 700;
  margin-bottom: 8px;
}

.operator-info {
  color: #777;
  font-size: 14px;
}

.material-block {
  border: 1px solid #ddd;

  border-radius: 12px;

  padding: 15px;

  margin-bottom: 12px;
}

.material-name {
  font-size: 17px;
  font-weight: 700;
}

.status {
  margin-top: 6px;

  font-size: 14px;

}

.status-installed {

}

.status-empty {
  color: #777;
}

.material-value {
  margin-top: 8px;

  word-break: break-all;

  color: #555;

  font-size: 14px;
}

.shop-row {
  display: flex;

  align-items: center;

  gap: 8px;

  margin-top: 9px;
}

.shop-code {
  flex: 1;

  padding: 11px;

  background: #f4f4f4;

  border-radius: 9px;

  word-break: break-all;

  font-size: 14px;
}

.shop-row button {
  width: auto;

  margin: 0;

  padding: 10px 12px;

  font-size: 14px;
}

#scannerCard,
#confirmBlock,
#status {
  display: none;
}

#scanner {

  position: relative;

  overflow: hidden;

  border-radius: 14px;

  background: #000;

  margin-top: 12px;
}

#video {

  width: 100%;

  display: block;
}

.frame {

  position: absolute;

  left: 10%;
  right: 10%;

  top: 28%;

  height: 44%;

  border: 3px solid #fff;

  border-radius: 10px;

  pointer-events: none;
}

.hint {

  position: absolute;

  bottom: 12px;

  left: 0;
  right: 0;

  text-align: center;

  color: #fff;

  font-size: 14px;

  text-shadow:
    0 1px 3px #000;
}

#stopScan {
  display: none;
}

#canvas {
  display: none;
}

.success {
  background: #e9f7e9;

  color: #176b17;

  padding: 13px;

  border-radius: 10px;
}

.error {
  background: #fdecec;

  color: #a00000;

  padding: 13px;

  border-radius: 10px;
}

.info {
  background: #eef3f8;

  color: #333;

  padding: 13px;

  border-radius: 10px;
}

.small {
  color: #777;

  font-size: 14px;
}

</style>

</head>


<body>

id="confirmBlock"

ПОДТВЕРДИТЬ И СОХРАНИТЬ

<script>


/* =========================================
   НАСТРОЙКИ
========================================= */


const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbxoJXLeVPG3Yiqx6tTovtkONlXNfPwXgqJyrAcCDf_gSksrzTHSifwKZkIJkH7_s99O-g/exec";


let stream = null;

let scanning = false;

let timer = null;

let currentOperator = "";

let currentMachineId = "";

let currentMachineName = "";

let currentOperation = "";

let scannedCode = "";



/* =========================================
   СТАТУС
========================================= */


function showStatus(message, type) {

  const el =
    document.getElementById("status");

  el.style.display = "block";

  el.className = type || "info";

  el.textContent = message;

}


function hideStatus() {

  document.getElementById(
    "status"
  ).style.display = "none";

}



/* =========================================
   ОТКРЫТИЕ МАШИНЫ
========================================= */


function openMachine() {


  const operator =
    document.getElementById(
      "operator"
    ).value;


  const machineSelect =
    document.getElementById(
      "machine"
    );


  const machineId =
    machineSelect.value;


  if (!operator) {

    document.getElementById(
      "startStatus"
    ).textContent =
      "Сначала выберите оператора.";

    return;

  }


  if (!machineId) {

    document.getElementById(
      "startStatus"
    ).textContent =
      "Выберите Z-стекер.";

    return;

  }


  currentOperator =
    operator;


  currentMachineId =
    machineId;


  currentMachineName =
    machineSelect.options[
      machineSelect.selectedIndex
    ].dataset.name;


  document.getElementById(
    "startScreen"
  ).style.display =
    "none";


  document.getElementById(
    "workScreen"
  ).style.display =
    "block";


  document.getElementById(
    "machineTitle"
  ).textContent =
    "Z-СТЕКЕР " +
    currentMachineName;


  document.getElementById(
    "operatorInfo"
  ).textContent =
    "Оператор: " +
    currentOperator;


  loadState();

}



/* =========================================
   ПОЛУЧЕНИЕ СОСТОЯНИЯ
========================================= */


function loadState() {


  showStatus(
    "Загрузка состояния...",
    "info"
  );


  const url =
    BACKEND_URL +
    "?action=getState" +
    "&machineId=" +
    encodeURIComponent(
      currentMachineId
    );


  fetch(url)

    .then(response =>
      response.text()
    )

    .then(text => {


      if (
        text.startsWith("ERROR|")
      ) {

        showStatus(
          text.substring(6),
          "error"
        );

        return;

      }


      try {

        const data =
          JSON.parse(text);


        updateGlue(
          data.glue || ""
        );


        updateSeparator(
          data.separator || ""
        );


        updateShops(

          data.shop1 || "",

          data.shop2 || ""

        );


        hideStatus();

      }

      catch(error) {

        showStatus(
          "Ошибка обработки состояния машины.",
          "error"
        );

      }

    })

    .catch(error => {

      showStatus(
        "Ошибка связи с сервером.",
        "error"
      );

    });

}



/* =========================================
   ОБНОВЛЕНИЕ КЛЕЯ
========================================= */


function updateGlue(code) {


  const status =
    document.getElementById(
      "glueStatus"
    );


  const value =
    document.getElementById(
      "glueValue"
    );


  if (code) {

    status.textContent =
      "🟢 УСТАНОВЛЕН";

    status.className =
      "status status-installed";

    value.textContent =
      code;

  }

  else {

    status.textContent =
      "⚪ НЕ УСТАНОВЛЕН";

    status.className =
      "status status-empty";

    value.textContent =
      "—";

  }

}



/* =========================================
   ОБНОВЛЕНИЕ СЕПАРАТОРА
========================================= */


function updateSeparator(code) {


  const status =
    document.getElementById(
      "separatorStatus"
    );


  const value =
    document.getElementById(
      "separatorValue"
    );


  if (code) {

    status.textContent =
      "🟢 УСТАНОВЛЕН";

    status.className =
      "status status-installed";

    value.textContent =
      code;

  }

  else {

    status.textContent =
      "⚪ НЕ УСТАНОВЛЕН";

    status.className =
      "status status-empty";

    value.textContent =
      "—";

  }

}



/* =========================================
   ОБНОВЛЕНИЕ МАГАЗИНОВ
========================================= */


function updateShops(
  shop1,
  shop2
) {


  const container =
    document.getElementById(
      "shopsContainer"
    );


  const status =
    document.getElementById(
      "shopsStatus"
    );


  const addButton =
    document.getElementById(
      "addShopButton"
    );


  container.innerHTML = "";


  const shops = [];


  if (shop1) {
    shops.push(shop1);
  }


  if (shop2) {
    shops.push(shop2);
  }


  if (shops.length === 0) {


    status.textContent =
      "⚪ НЕ УСТАНОВЛЕНЫ";

    status.className =
      "status status-empty";


  }

  else {


    status.textContent =
      "🟢 УСТАНОВЛЕНЫ: " +
      shops.length;

    status.className =
      "status status-installed";


    shops.forEach(
      function(shop) {


        const row =
          document.createElement(
            "div"
          );


        row.className =
          "shop-row";


        const code =
          document.createElement(
            "div"
          );


        code.className =
          "shop-code";


        code.textContent =
          shop;


        const button =
          document.createElement(
            "button"
          );


        button.className =
          "danger";


        button.textContent =
          "СНЯТЬ";


        button.onclick =
          function() {

            removeShop(shop);

          };


        row.appendChild(code);

        row.appendChild(button);

        container.appendChild(row);

      }

    );

  }


  if (shops.length >= 2) {

    addButton.style.display =
      "none";

  }

  else {

    addButton.style.display =
      "block";

  }

}



/* =========================================
   ЗАПУСК СКАНЕРА
========================================= */


function startScan(
  operation,
  title
) {


  currentOperation =
    operation;


  scannedCode = "";


  document.getElementById(
    "scannerCard"
  ).style.display =
    "block";


  document.getElementById(
    "scanTitle"
  ).textContent =
    title;


  document.getElementById(
    "confirmBlock"
  ).style.display =
    "none";


  startScanner();

}



/* =========================================
   КНОПКИ СКАНИРОВАНИЯ
========================================= */


function startGlueScan() {

  startScan(
    "Замена клея",
    "СКАНИРУЙТЕ КЛЕЙ"
  );

}


function startSeparatorScan() {

  startScan(
    "Замена сепаратора",
    "СКАНИРУЙТЕ СЕПАРАТОР"
  );

}


function startShopScan() {

  startScan(
    "Установка магазина",
    "СКАНИРУЙТЕ МАГАЗИН"
  );

}



/* =========================================
   КАМЕРА
========================================= */


async function startScanner() {


  try {


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      showStatus(
        "Браузер не поддерживает камеру.",
        "error"
      );

      return;

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        audio: false,

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        }

      });


    const video =
      document.getElementById(
        "video"
      );


    video.srcObject =
      stream;


    video.setAttribute(
      "playsinline",
      ""
    );


    video.muted = true;


    await video.play();


    document.getElementById(
      "scanner"
    ).style.display =
      "block";


    document.getElementById(
      "stopScan"
    ).style.display =
      "block";


    scanning = true;


    showStatus(
      "Камера работает. Ищу код...",
      "info"
    );


    scanLoop();


  }

  catch(error) {


    stopScanner();


    showStatus(
      "Не удалось открыть камеру: " +
      (
        error.name ||
        error.message
      ),
      "error"
    );

  }

}



/* =========================================
   ЦИКЛ СКАНИРОВАНИЯ
========================================= */


function scanLoop() {


  if (!scanning) {
    return;
  }


  const video =
    document.getElementById(
      "video"
    );


  const canvas =
    document.getElementById(
      "canvas"
    );


  if (
    video.readyState >= 2 &&
    video.videoWidth
  ) {


    canvas.width =
      video.videoWidth;


    canvas.height =
      video.videoHeight;


    const context =
      canvas.getContext(
        "2d",
        {
          willReadFrequently:
            true
        }
      );


    context.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const image =
      context.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const result =
      jsQR(

        image.data,

        image.width,

        image.height,

        {
          inversionAttempts:
            "attemptBoth"
        }

      );


    if (
      result &&
      result.data
    ) {


      scannedCode =
        result.data;


      stopScanner();


      showConfirmation();


      return;

    }

  }


  timer =
    setTimeout(
      scanLoop,
      120
    );

}



/* =========================================
   ОСТАНОВКА КАМЕРЫ
========================================= */


function stopScanner() {


  scanning = false;


  if (timer) {

    clearTimeout(timer);

  }


  timer = null;


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

    stream = null;

  }


  const video =
    document.getElementById(
      "video"
    );


  video.srcObject = null;


  document.getElementById(
    "scanner"
  ).style.display =
    "none";


  document.getElementById(
    "stopScan"
  ).style.display =
    "none";

}



/* =========================================
   ПОДТВЕРЖДЕНИЕ
========================================= */


function showConfirmation() {


  const type =
    currentOperation;


  document.getElementById(
    "confirmBlock"
  ).style.display =
    "block";


  document.getElementById(
    "confirmData"
  ).innerHTML =

    "<b>Машина:</b> " +

    escapeHtml(
      currentMachineName
    ) +

    "<br><br>" +

    "<b>Оператор:</b> " +

    escapeHtml(
      currentOperator
    ) +

    "<br><br>" +

    "<b>Операция:</b> " +

    escapeHtml(
      type
    ) +

    "<br><br>" +

    "<b>Код:</b> " +

    escapeHtml(
      scannedCode
    );


  showStatus(
    "Код считан. Проверьте данные.",
    "info"
  );

}



/* =========================================
   СОХРАНЕНИЕ ОПЕРАЦИИ
========================================= */


function confirmOperation() {


  if (!scannedCode) {

    showStatus(
      "Код не найден.",
      "error"
    );

    return;

  }


  showStatus(
    "Сохраняем...",
    "info"
  );


  const url =

    BACKEND_URL +

    "?action=save" +

    "&operator=" +
    encodeURIComponent(
      currentOperator
    ) +

    "&machineId=" +
    encodeURIComponent(
      currentMachineId
    ) +

    "&machine=" +
    encodeURIComponent(
      currentMachineName
    ) +

    "&operation=" +
    encodeURIComponent(
      currentOperation
    ) +

    "&materialType=" +
    encodeURIComponent(
      getMaterialType()
    ) +

    "&materialCode=" +
    encodeURIComponent(
      scannedCode
    ) +

    "&batch=" +
    encodeURIComponent(
      scannedCode
    );


  fetch(url)

    .then(response =>
      response.text()
    )

    .then(text => {


      if (
        text.startsWith("ERROR|")
      ) {

        showStatus(
          text.substring(6),
          "error"
        );

        return;

      }


      document.getElementById(
        "confirmBlock"
      ).style.display =
        "none";


      document.getElementById(
        "scannerCard"
      ).style.display =
        "none";


      showStatus(
        "✓ Операция успешно сохранена.",
        "success"
      );


      scannedCode = "";


      currentOperation = "";


      loadState();

    })

    .catch(error => {

      showStatus(
        "Ошибка передачи данных.",
        "error"
      );

    });

}



/* =========================================
   ТИП МАТЕРИАЛА
========================================= */


function getMaterialType() {


  if (
    currentOperation ===
    "Замена клея"
  ) {

    return "Клей";

  }


  if (
    currentOperation ===
    "Замена сепаратора"
  ) {

    return "Сепаратор";

  }


  if (
    currentOperation ===
    "Установка магазина"
  ) {

    return "Магазин электродов";

  }


  return "";

}



/* =========================================
   СНЯТИЕ МАГАЗИНА
========================================= */


function removeShop(shopCode) {


  const ok =
    confirm(
      "Снять магазин " +
      shopCode +
      "?"
    );


  if (!ok) {
    return;
  }


  currentOperation =
    "Снятие магазина";


  scannedCode =
    shopCode;


  showStatus(
    "Снимаем магазин...",
    "info"
  );


  const url =

    BACKEND_URL +

    "?action=save" +

    "&operator=" +
    encodeURIComponent(
      currentOperator
    ) +

    "&machineId=" +
    encodeURIComponent(
      currentMachineId
    ) +

    "&machine=" +
    encodeURIComponent(
      currentMachineName
    ) +

    "&operation=" +
    encodeURIComponent(
      "Снятие магазина"
    ) +

    "&materialType=" +
    encodeURIComponent(
      "Магазин электродов"
    ) +

    "&materialCode=" +
    encodeURIComponent(
      shopCode
    ) +

    "&batch=" +
    encodeURIComponent(
      shopCode
    );


  fetch(url)

    .then(response =>
      response.text()
    )

    .then(text => {


      if (
        text.startsWith("ERROR|")
      ) {

        showStatus(
          text.substring(6),
          "error"
        );

        return;

      }


      showStatus(
        "✓ Магазин снят.",
        "success"
      );


      loadState();

    })

    .catch(error => {

      showStatus(
        "Ошибка передачи данных.",
        "error"
      );

    });

}



/* =========================================
   ОТМЕНА
========================================= */


function cancelOperation() {


  scannedCode = "";

  currentOperation = "";


  stopScanner();


  document.getElementById(
    "scannerCard"
  ).style.display =
    "none";


  document.getElementById(
    "confirmBlock"
  ).style.display =
    "none";


  showStatus(
    "Операция отменена.",
    "info"
  );

}



/* =========================================
   ДРУГАЯ МАШИНА
========================================= */


function changeMachine() {


  stopScanner();


  document.getElementById(
    "workScreen"
  ).style.display =
    "none";


  document.getElementById(
    "scannerCard"
  ).style.display =
    "none";


  document.getElementById(
    "confirmBlock"
  ).style.display =
    "none";


  document.getElementById(
    "startScreen"
  ).style.display =
    "block";


  hideStatus();

}



/* =========================================
   ЗАЩИТА HTML
========================================= */


function escapeHtml(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
