<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#222">
<title>Тест универсального сканера</title>

<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f3f3f3;color:#222;
}
.app{max-width:560px;margin:auto}
h1{text-align:center;font-size:24px;margin:10px 0 4px}
.subtitle{text-align:center;color:#777;margin-bottom:18px}
.card{
  background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.06)
}
button{
  width:100%;border:0;border-radius:12px;padding:15px;
  font-size:16px;font-weight:700;margin-top:9px
}
.primary{background:#222;color:#fff}
.blue{background:#1677ff;color:#fff}
.gray{background:#e5e5e5;color:#222}
video{
  width:100%;display:block;background:#000;border-radius:12px;
  margin-top:12px
}
.scanner{position:relative;overflow:hidden;border-radius:12px;background:#000}
.frame{
  position:absolute;left:7%;right:7%;top:28%;height:44%;
  border:3px solid #fff;border-radius:10px;pointer-events:none
}
.hint{
  position:absolute;bottom:10px;left:0;right:0;text-align:center;
  color:#fff;font-size:14px;text-shadow:0 1px 3px #000
}
.status{padding:12px;border-radius:10px;margin-top:10px}
.info{background:#eef3f8}
.success{background:#e9f7e9;color:#176b17}
.error{background:#fdecec;color:#a00000}
.row{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.label{width:105px;flex:0 0 105px;color:#777;font-size:14px}
.value{
  flex:1;word-break:break-all;font-weight:600;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace
}
.big{font-size:20px}
.small{font-size:13px;color:#777}
input[type=file]{width:100%;font-size:15px}
canvas{display:none}
</style>
</head>

<body>
<div class="app">

<h1>ТЕСТ СКАНЕРА</h1>
<div class="subtitle">QR + 1D штрихкоды + Data Matrix</div>

<div class="card">
  <button id="start" class="primary">📷 ЗАПУСТИТЬ СКАНЕР</button>
  <button id="stop" class="gray" style="display:none">ОСТАНОВИТЬ КАМЕРУ</button>

  <div id="scanner" class="scanner" style="display:none">
    <video id="video" autoplay muted playsinline></video>
    <div class="frame"></div>
    <div class="hint">Наведите код в рамку</div>
  </div>

  <div id="cameraStatus" class="status info">
    Камера не запущена.
  </div>
</div>

<div class="card">
  <b>РЕЗУЛЬТАТ</b>

  <div class="row">
    <div class="label">Значение:</div>
    <div id="result" class="value big">—</div>
  </div>

  <div class="row">
    <div class="label">Тип:</div>
    <div id="format" class="value">—</div>
  </div>

  <div class="row">
    <div class="label">Время:</div>
    <div id="time" class="value">—</div>
  </div>
</div>

<div class="card">
  <b>ТЕСТ ПО ФОТО</b>
  <div class="small" style="margin-top:7px">
    Можно загрузить фотографию этикетки. Это поможет понять,
    проблема в камере или в самом распознавании кода.
  </div>
  <input id="photo" type="file" accept="image/*" style="margin-top:12px">
  <div id="photoStatus" class="status info">
    Фото не выбрано.
  </div>
</div>

<div id="history" class="card">
  <b>ИСТОРИЯ СЧИТЫВАНИЙ</b>
  <div id="historyList" class="small" style="margin-top:10px">
    Пока пусто.
  </div>
</div>

<canvas id="canvas"></canvas>

</div>

<script>
let reader = null;
let controls = null;
let startedAt = 0;
let lastValue = "";
let history = [];

const video = document.getElementById("video");
const scanner = document.getElementById("scanner");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const cameraStatus = document.getElementById("cameraStatus");

function setCameraStatus(text, type="info"){
  cameraStatus.textContent = text;
  cameraStatus.className = "status " + type;
}

function showResult(text, format, elapsed){
  document.getElementById("result").textContent = text || "—";
  document.getElementById("format").textContent = format || "—";
  document.getElementById("time").textContent = elapsed ? elapsed + " мс" : "—";
}

function addHistory(text, format){
  if(!text) return;

  const now = new Date().toLocaleTimeString("ru-RU");
  history.unshift({text,format,time:now});
  history = history.slice(0,10);

  document.getElementById("historyList").innerHTML =
    history.map((x,i) =>
      `<div style="padding:8px 0;border-bottom:1px solid #eee">
        <b>${i+1}. ${escapeHtml(x.time)}</b><br>
        <span>${escapeHtml(x.format || "не определён")}</span><br>
        <span style="word-break:break-all;font-family:monospace">${escapeHtml(x.text)}</span>
      </div>`
    ).join("");
}

function escapeHtml(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function startScanner(){
  try{
    if(!window.ZXingBrowser){
      setCameraStatus("Библиотека сканера не загрузилась.", "error");
      return;
    }

    await stopScanner();

    reader = new ZXingBrowser.BrowserMultiFormatReader();

    scanner.style.display = "block";
    startBtn.style.display = "none";
    stopBtn.style.display = "block";

    setCameraStatus(
      "Камера запускается. Ищу QR, Data Matrix и 1D штрихкод...",
      "info"
    );

    startedAt = performance.now();

    controls = await reader.decodeFromConstraints(
      {
        audio:false,
        video:{
          facingMode:{ideal:"environment"},
          width:{ideal:1920},
          height:{ideal:1080}
        }
      },
      video,
      (result, error) => {

        if(result){
          const text = result.getText();
          const format = result.getBarcodeFormat
            ? String(result.getBarcodeFormat())
            : "UNKNOWN";

          const elapsed = Math.round(performance.now() - startedAt);

          if(text && text !== lastValue){
            lastValue = text;

            showResult(text, format, elapsed);
            addHistory(text, format);

            setCameraStatus(
              "✓ КОД СЧИТАН",
              "success"
            );

            if(navigator.vibrate){
              navigator.vibrate(120);
            }

            stopScanner();
          }
        }
      }
    );

    if(video.readyState >= 2){
      setCameraStatus(
        "Камера работает. Наведите код в рамку.",
        "info"
      );
    }

  }catch(error){
    await stopScanner();

    setCameraStatus(
      "Ошибка камеры: " +
      (error.name || error.message || "неизвестная ошибка"),
      "error"
    );
  }
}

async function stopScanner(){
  try{
    if(controls){
      controls.stop();
      controls = null;
    }
  }catch(e){}

  try{
    if(reader && reader.reset){
      reader.reset();
    }
  }catch(e){}

  reader = null;

  if(video.srcObject){
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }

  scanner.style.display = "none";
  startBtn.style.display = "block";
  stopBtn.style.display = "none";
}

startBtn.addEventListener("click", startScanner);
stopBtn.addEventListener("click", async () => {
  await stopScanner();
  setCameraStatus("Камера остановлена.", "info");
});

document.getElementById("photo").addEventListener("change", async function(){
  const file = this.files && this.files[0];
  if(!file) return;

  const photoStatus = document.getElementById("photoStatus");
  photoStatus.textContent = "Анализируем фотографию...";
  photoStatus.className = "status info";

  try{
    if(!window.ZXingBrowser){
      throw new Error("Библиотека сканера не загрузилась");
    }

    const img = new Image();
    const url = URL.createObjectURL(file);

    img.onload = async () => {
      try{
        const imageReader = new ZXingBrowser.BrowserMultiFormatReader();

        const result = await imageReader.decodeFromImageElement(img);

        if(result){
          const text = result.getText();
          const format = result.getBarcodeFormat
            ? String(result.getBarcodeFormat())
            : "UNKNOWN";

          showResult(text, format, 0);
          addHistory(text, format);

          photoStatus.textContent =
            "✓ Код найден на фотографии.";
          photoStatus.className = "status success";
        }else{
          photoStatus.textContent =
            "Код на фотографии не найден.";
          photoStatus.className = "status error";
        }
      }catch(e){
        photoStatus.textContent =
          "Код на фотографии не распознан.";
        photoStatus.className = "status error";
      }finally{
        URL.revokeObjectURL(url);
      }
    };

    img.onerror = () => {
      URL.revokeObjectURL(url);
      photoStatus.textContent = "Не удалось открыть фотографию.";
      photoStatus.className = "status error";
    };

    img.src = url;

  }catch(error){
    photoStatus.textContent =
      "Ошибка анализа фотографии: " +
      (error.message || error);
    photoStatus.className = "status error";
  }
});
</script>
</body>
</html>
