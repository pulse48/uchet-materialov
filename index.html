<!doctype html>
<html lang="ru">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover">

<meta name="theme-color" content="#222">

<title>Учёт материалов</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #f4f4f4;
  color: #222;
}

.app {
  max-width: 520px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 25px;
  margin: 10px 0 5px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 20px;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 15px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.06);
}

label {
  display: block;
  font-weight: 600;
  margin-bottom: 7px;
}

select,
input {
  width: 100%;
  padding: 15px;

  border:
    1px solid #ccc;

  border-radius: 10px;

  font-size: 18px;

  background: #fff;
}

button {
  width: 100%;

  border: 0;

  border-radius: 12px;

  padding: 16px;

  font-size: 17px;

  font-weight: 600;

  margin-top: 12px;
}

.primary {
  background: #222;
  color: #fff;
}

.blue {
  background: #1677ff;
  color: #fff;
}

.gray {
  background: #e5e5e5;
  color: #222;
}

.danger {
  background: #eee;
  color: #a00000;
}

.machine-title {
  font-size: 23px;
  font-weight: 700;
  margin-bottom: 18px;
}

.material-block {
  border: 1px solid #ddd;

  border-radius: 12px;

  padding: 15px;

  margin-bottom: 12px;
}

.material-name {
  font-size: 17px;
  font-weight: 700;
}

.material-value {
  margin-top: 7px;

  word-break: break-all;

  color: #555;
}

#workScreen {
  display: none;
}

#scanner {
  display: none;

  position: relative;

  margin-top: 15px;

  overflow: hidden;

  border-radius: 14px;

  background: #000;
}

#video {
  width: 100%;
  display: block;
}

.frame {

  position: absolute;

  left: 10%;
  right: 10%;

  top: 28%;

  height: 44%;

  border: 3px solid #fff;

  border-radius: 10px;

  pointer-events: none;
}

.hint {

  position: absolute;

  bottom: 12px;

  left: 0;
  right: 0;

  text-align: center;

  color: #fff;

  font-size: 14px;

  text-shadow:
    0 1px 3px #000;
}

#stopScan {
  display: none;
}

#confirmBlock {
  display: none;
}

#status {

  display: none;

  margin-top: 14px;

  padding: 13px;

  border-radius: 10px;

  font-size: 16px;

  word-break: break-word;
}

.success {
  background: #e9f7e9;
  color: #176b17;
}

.error {
  background: #fdecec;
  color: #a00000;
}

.info {
  background: #eef3f8;
  color: #333;
}

canvas {
  display: none;
}

.small {
  color: #777;
  font-size: 14px;
}

</style>

</head>


<body>


<div class="app">


<h1>
УЧЁТ МАТЕРИАЛОВ
</h1>


<div class="subtitle">
Z-стекеры — тестовая версия
</div>


<!-- ========================= -->
<!-- ВЫБОР ОПЕРАТОРА -->
<!-- ========================= -->

<div
id="startScreen"
class="card">


<label>
Оператор
</label>


<select id="operator">

<option value="">
Выберите оператора
</option>

<option value="Иванов И.И.">
Иванов И.И.
</option>

<option value="Петров П.П.">
Петров П.П.
</option>

<option value="Сидоров С.С.">
Сидоров С.С.
</option>

</select>


<label style="margin-top:18px;">
Z-стекер
</label>


<select id="machine">

<option value="">
Выберите Z-стекер
</option>

<option value="ZST-001"
data-name="Z-01">
Z-01
</option>

<option value="ZST-002"
data-name="Z-02">
Z-02
</option>

<option value="ZST-003"
data-name="Z-03">
Z-03
</option>

<option value="ZST-004"
data-name="Z-04">
Z-04
</option>

<option value="ZST-005"
data-name="Z-05">
Z-05
</option>

<option value="ZST-006"
data-name="Z-06">
Z-06
</option>

</select>


<button
class="primary"
onclick="openMachine()">

ОТКРЫТЬ Z-СТЕКЕР

</button>


<div
id="startStatus"
class="small"
style="margin-top:12px;">

Выберите оператора и машину

</div>


</div>


<!-- ========================= -->
<!-- РАБОЧИЙ ЭКРАН -->
<!-- ========================= -->

<div
id="workScreen">


<div class="card">


<div
id="machineTitle"
class="machine-title">

Z-СТЕКЕР

</div>


<div
id="operatorInfo"
class="small">

</div>


</div>


<!-- КЛЕЙ -->

<div class="card">


<div class="material-block">


<div class="material-name">
КЛЕЙ
</div>


<div
id="glueValue"
class="material-value">

Не установлен

</div>


<button
class="blue"
onclick="startGlueScan()">

ЗАМЕНИТЬ КЛЕЙ

</button>


</div>


<!-- СЕПАРАТОР ПОКА НЕ АКТИВЕН -->

<div class="material-block">

<div class="material-name">
СЕПАРАТОР
</div>

<div class="material-value">
Будет добавлен следующим этапом
</div>

</div>


<!-- МАГАЗИНЫ ПОКА НЕ АКТИВНЫ -->

<div class="material-block">

<div class="material-name">
МАГАЗИНЫ ЭЛЕКТРОДОВ
</div>

<div class="material-value">
Будут добавлены следующим этапом
</div>

</div>


<button
class="gray"
onclick="changeMachine()">

📷 СКАНИРОВАТЬ / ВЫБРАТЬ ДРУГУЮ МАШИНУ

</button>


</div>


</div>


<!-- ========================= -->
<!-- СКАНЕР -->
<!-- ========================= -->

<div
id="scannerCard"
class="card"
style="display:none;">


<div
id="scanTitle"
class="machine-title">

СКАНИРОВАНИЕ

</div>


<div id="scanner">


<video
id="video"
autoplay
muted
playsinline>
</video>


<div class="frame">
</div>


<div class="hint">

Наведите QR-код в рамку

</div>


</div>


<button
id="stopScan"
class="gray"
onclick="stopScanner()">

ОСТАНОВИТЬ КАМЕРУ

</button>


<canvas id="canvas">
</canvas>


</div>


<!-- ========================= -->
<!-- ПОДТВЕРЖДЕНИЕ -->
<!-- ========================= -->

<div
id="confirmBlock"
class="card">


<div class="machine-title">

ПРОВЕРЬТЕ ДАННЫЕ

</div>


<div
id="confirmData"
class="material-value">

</div>


<button
class="blue"
onclick="confirmGlue()">

ПОДТВЕРДИТЬ И СОХРАНИТЬ

</button>


<button
class="gray"
onclick="cancelOperation()">

ОТМЕНА

</button>


</div>


<div
id="status">
</div>


</div>


<script>


/* ==========================================
   НАСТРОЙКИ
========================================== */


const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbxoJXLeVPG3Yiqx6tTovtkONlXNfPwXgqJyrAcCDf_gSksrzTHSifwKZkIJkH7_s99O-g/exec";


let stream = null;

let scanning = false;

let timer = null;

let currentOperator = "";

let currentMachineId = "";

let currentMachineName = "";

let scannedGlue = "";



/* ==========================================
   СТАТУС
========================================== */


function showStatus(message, type) {

  const element =
    document.getElementById("status");

  element.style.display =
    "block";

  element.className = "";

  element.classList.add(
    type || "info"
  );

  element.textContent =
    message;

}



/* ==========================================
   ОТКРЫТИЕ МАШИНЫ
========================================== */


function openMachine() {


  const operator =
    document.getElementById(
      "operator"
    ).value;


  const machine =
    document.getElementById(
      "machine"
    );


  const machineId =
    machine.value;


  if (!operator) {

    document.getElementById(
      "startStatus"
    ).textContent =
      "Сначала выберите оператора.";

    return;

  }


  if (!machineId) {

    document.getElementById(
      "startStatus"
    ).textContent =
      "Выберите Z-стекер.";

    return;

  }


  currentOperator =
    operator;


  currentMachineId =
    machineId;


  currentMachineName =
    machine.options[
      machine.selectedIndex
    ].dataset.name;


  document.getElementById(
    "startScreen"
  ).style.display =
    "none";


  document.getElementById(
    "workScreen"
  ).style.display =
    "block";


  document.getElementById(
    "machineTitle"
  ).textContent =
    "Z-СТЕКЕР " +
    currentMachineName;


  document.getElementById(
    "operatorInfo"
  ).textContent =
    "Оператор: " +
    currentOperator;


  loadState();

}



/* ==========================================
   ПОЛУЧЕНИЕ ТЕКУЩЕГО СОСТОЯНИЯ
========================================== */


function loadState() {


  showStatus(
    "Загрузка состояния машины...",
    "info"
  );


  const url =
    BACKEND_URL +
    "?action=getState" +
    "&machineId=" +
    encodeURIComponent(
      currentMachineId
    );


  fetch(url)

    .then(response =>
      response.text()
    )

    .then(text => {


      if (
        text.startsWith("ERROR|")
      ) {

        showStatus(
          text.substring(6),
          "error"
        );

        return;

      }


      try {

        const data =
          JSON.parse(text);


        document.getElementById(
          "glueValue"
        ).textContent =
          data.glue ||
          "Не установлен";


        hideStatus();

      }

      catch(error) {

        showStatus(
          "Не удалось получить состояние машины.",
          "error"
        );

      }

    })

    .catch(error => {

      showStatus(
        "Ошибка связи с сервером.",
        "error"
      );

    });

}



/* ==========================================
   СКАНИРОВАНИЕ КЛЕЯ
========================================== */


function startGlueScan() {


  scannedGlue = "";


  document.getElementById(
    "scannerCard"
  ).style.display =
    "block";


  document.getElementById(
    "scanTitle"
  ).textContent =
    "СКАНИРУЙТЕ КЛЕЙ";


  startScanner();

}



/* ==========================================
   КАМЕРА
========================================== */


async function startScanner() {


  try {


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      showStatus(
        "Браузер не поддерживает камеру.",
        "error"
      );

      return;

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        audio: false,

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        }

      });


    const video =
      document.getElementById(
        "video"
      );


    video.srcObject =
      stream;


    video.setAttribute(
      "playsinline",
      ""
    );


    video.muted = true;


    await video.play();


    document.getElementById(
      "scanner"
    ).style.display =
      "block";


    document.getElementById(
      "stopScan"
    ).style.display =
      "block";


    scanning = true;


    showStatus(
      "Камера работает. Ищу QR-код...",
      "info"
    );


    scanLoop();


  }


  catch(error) {


    stopScanner();


    showStatus(
      "Не удалось открыть камеру: " +
      (
        error.name ||
        error.message
      ),
      "error"
    );

  }

}



/* ==========================================
   ПОИСК QR
========================================== */


function scanLoop() {


  if (!scanning) {
    return;
  }


  const video =
    document.getElementById(
      "video"
    );


  const canvas =
    document.getElementById(
      "canvas"
    );


  if (
    video.readyState >= 2 &&
    video.videoWidth
  ) {


    canvas.width =
      video.videoWidth;


    canvas.height =
      video.videoHeight;


    const context =
      canvas.getContext(
        "2d",
        {
          willReadFrequently:
            true
        }
      );


    context.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const image =
      context.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const result =
      jsQR(

        image.data,

        image.width,

        image.height,

        {
          inversionAttempts:
            "attemptBoth"
        }

      );


    if (
      result &&
      result.data
    ) {


      scannedGlue =
        result.data;


      stopScanner();


      showGlueConfirmation();


      return;

    }

  }


  timer =
    setTimeout(
      scanLoop,
      120
    );

}



/* ==========================================
   ОСТАНОВКА КАМЕРЫ
========================================== */


function stopScanner() {


  scanning = false;


  if (timer) {

    clearTimeout(timer);

  }


  timer = null;


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

    stream = null;

  }


  document.getElementById(
    "video"
  ).srcObject = null;


  document.getElementById(
    "scanner"
  ).style.display =
    "none";


  document.getElementById(
    "stopScan"
  ).style.display =
    "none";

}



/* ==========================================
   ПОДТВЕРЖДЕНИЕ КЛЕЯ
========================================== */


function showGlueConfirmation() {


  document.getElementById(
    "confirmBlock"
  ).style.display =
    "block";


  document.getElementById(
    "confirmData"
  ).innerHTML =

    "<b>Машина:</b> " +
    currentMachineName +

    "<br><br>" +

    "<b>Оператор:</b> " +
    currentOperator +

    "<br><br>" +

    "<b>Материал:</b> Клей" +

    "<br><br>" +

    "<b>Код:</b> " +
    escapeHtml(
      scannedGlue
    );


  showStatus(
    "QR-код считан. Проверьте данные.",
    "info"
  );

}



/* ==========================================
   СОХРАНЕНИЕ КЛЕЯ
========================================== */


function confirmGlue() {


  if (!scannedGlue) {

    showStatus(
      "Код клея отсутствует.",
      "error"
    );

    return;

  }


  showStatus(
    "Сохраняем...",
    "info"
  );


  const url =
    BACKEND_URL +

    "?action=save" +

    "&operator=" +
    encodeURIComponent(
      currentOperator
    ) +

    "&machineId=" +
    encodeURIComponent(
      currentMachineId
    ) +

    "&machine=" +
    encodeURIComponent(
      currentMachineName
    ) +

    "&operation=" +
    encodeURIComponent(
      "Замена клея"
    ) +

    "&materialType=" +
    encodeURIComponent(
      "Клей"
    ) +

    "&materialCode=" +
    encodeURIComponent(
      scannedGlue
    ) +

    "&batch=" +
    encodeURIComponent(
      scannedGlue
    );


  fetch(url)

    .then(response =>
      response.text()
    )

    .then(text => {


      if (
        text.startsWith("ERROR|")
      ) {

        showStatus(
          text.substring(6),
          "error"
        );

        return;

      }


      document.getElementById(
        "confirmBlock"
      ).style.display =
        "none";


      scannedGlue = "";


      showStatus(
        "✓ Клей успешно заменён.",
        "success"
      );


      loadState();


    })

    .catch(error => {

      showStatus(
        "Ошибка передачи данных.",
        "error"
      );

    });

}



/* ==========================================
   ОТМЕНА
========================================== */


function cancelOperation() {


  scannedGlue = "";


  document.getElementById(
    "confirmBlock"
  ).style.display =
    "none";


  document.getElementById(
    "scannerCard"
  ).style.display =
    "none";


  stopScanner();


  showStatus(
    "Операция отменена.",
    "info"
  );

}



/* ==========================================
   СМЕНА МАШИНЫ
========================================== */


function changeMachine() {


  stopScanner();


  document.getElementById(
    "workScreen"
  ).style.display =
    "none";


  document.getElementById(
    "scannerCard"
  ).style.display =
    "none";


  document.getElementById(
    "confirmBlock"
  ).style.display =
    "none";


  document.getElementById(
    "startScreen"
  ).style.display =
    "block";


  hideStatus();

}



/* ==========================================
   СКРЫТЬ СТАТУС
========================================== */


function hideStatus() {

  document.getElementById(
    "status"
  ).style.display =
    "none";

}



/* ==========================================
   ЗАЩИТА HTML
========================================== */


function escapeHtml(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


</script>


</body>

</html>
